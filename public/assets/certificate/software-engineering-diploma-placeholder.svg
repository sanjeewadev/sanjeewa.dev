  <rect width="1200" height="850" fill="#f8f6f1"/>
  <rect x="36" y="36" width="1128" height="778" rx="6" fill="#ffffff" stroke="#1769ff" stroke-width="3"/>
  <rect x="54" y="54" width="1092" height="742" rx="4" fill="none" stroke="#d9d5cd" stroke-width="1.5"/>
  <circle cx="600" cy="165" r="58" fill="#eef5ff"/>
  <path d="M574 164h52M600 138v52" stroke="#1769ff" stroke-width="10" stroke-linecap="round"/>
  <text x="600" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#171717" letter-spacing="5">TEMPORARY CERTIFICATE PREVIEW</text>
  <text x="600" y="350" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-style="italic" fill="#1769ff">Software Engineering Diploma</text>
